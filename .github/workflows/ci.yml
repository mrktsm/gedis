name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          gofmt -w .
          git diff --exit-code

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Fuzz RESP decoder
        run: go test -run '^$' -fuzz '^FuzzReader$' -fuzztime 5s ./internal/resp

      - name: Smoke-test benchmark harness
        run: go test -run '^$' -bench '^Benchmark(Engine|TCP)Commands$' -benchtime 10ms -count 1 ./internal/server

      - name: Build server
        run: |
          go build -o /tmp/gedis ./cmd/gedis
          go build -o /tmp/gedis-healthcheck ./cmd/gedis-healthcheck

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build container image
        run: docker build --tag gedis:ci .

      - name: Start primary and replica demo
        run: |
          docker compose up --detach --wait
          docker compose ps

      - name: Stop container demo
        if: always()
        run: docker compose down --volumes
