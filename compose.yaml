name: gedis-demo

services:
  primary:
    build:
      context: .
    command:
      - -addr
      - 0.0.0.0:6379
      - -appendonly
      - -appendfsync
      - everysec
      - -aof-path
      - /data/appendonly.aof
    ports:
      - "6379:6379"
    volumes:
      - primary-data:/data
    stop_grace_period: 10s

  replica:
    build:
      context: .
    command:
      - -addr
      - 0.0.0.0:6379
      - -replicaof
      - primary:6379
      - -appendonly
      - -appendfsync
      - everysec
      - -aof-path
      - /data/appendonly.aof
    depends_on:
      primary:
        condition: service_healthy
    ports:
      - "6380:6379"
    volumes:
      - replica-data:/data
    stop_grace_period: 10s

volumes:
  primary-data:
  replica-data:
